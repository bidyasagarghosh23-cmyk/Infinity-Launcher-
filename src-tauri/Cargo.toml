[package]
name = "infinity-launcher"
version = "2.0.0"
description = "Infinity Launcher — a custom Minecraft: Java Edition launcher"
authors = ["Infinity Launcher contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "infinity_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
futures-util = "0.3"

reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "gzip",
    "charset",
] }

sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2"
base64 = "0.22"
sysinfo = "0.32"

[features]
# Trimmed down by `tauri build` for release; safe to leave empty.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
